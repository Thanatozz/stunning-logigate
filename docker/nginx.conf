server {
    listen 80;
    server_name app.aliadodigital.cl _;

    # Behind Dokploy/Traefik, requests arrive via HTTP to this container.
    # Use X-Forwarded-Proto to keep HTTPS as canonical.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # Browsers only honor HSTS when this response is delivered over HTTPS
    # (terminated by the reverse proxy).
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets generated by Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config injected from container env vars on startup
    location = /runtime-config.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Healthcheck endpoint for Dokploy / Traefik
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
