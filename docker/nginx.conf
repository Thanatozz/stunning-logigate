server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets generated by Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck endpoint for Dokploy / Traefik
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
