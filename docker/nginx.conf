server {
    listen 80;
    server_name _;

    # HTTP-only mode:
    # If upstream proxy (Traefik/Nginx Proxy Manager/Dokploy) forwards requests that
    # originally arrived as HTTPS, force browser redirect back to HTTP.
    if ($http_x_forwarded_proto = "https") {
        return 301 http://$host$request_uri;
    }

    # Ask clients to clear previous HSTS policy if they had one cached for this host.
    # (HSTS is only honored when received over HTTPS responses.)
    add_header Strict-Transport-Security "max-age=0" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets generated by Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config injected from container env vars on startup
    location = /runtime-config.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Healthcheck endpoint for Dokploy / Traefik
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
